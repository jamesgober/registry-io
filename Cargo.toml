[package]
name = "registry-io"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "High-performance event/callback registry for Rust. Sync-first with optional async. Lock-free reads, zero-allocation hot path, sub-50ns notify target. Designed as the foundation primitive for portfolio crates needing fast in-process notification."

keywords = [
    "registry",
    "callbacks",
    "observer",
    "events",
    "rust"
]

categories = [
    "rust-patterns",
    "concurrency",
    "asynchronous"
]

documentation = "https://docs.rs/registry-io"
repository    = "https://github.com/jamesgober/registry-io"
homepage      = "https://github.com/jamesgober/registry-io"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "registry_io"
path = "src/lib.rs"

[features]
default = ["std", "sync"]

# Core feature flags
# `std` pulls in the standard library; required for the sync and async registries.
std = []
# `sync` enables the SyncRegistry and all synchronous-side machinery (priority,
# guards, panic isolation). Implies `std`.
sync = ["std"]
# `async` enables the AsyncRegistry. Implies `std`.
async = ["std"]
# `hybrid` activates both sync and async paths.
hybrid = ["sync", "async"]

# Optional integrations (placeholders, no code yet).
metrics = []

# Flips on the `dhat`-backed zero-allocation verification test
# (`tests/zero_alloc.rs`). Off by default because it replaces the global
# allocator with `dhat::Alloc`, which would skew unrelated benchmarks.
dhat-heap = []

# No runtime dependencies under any feature set.
[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Used only by `tests/zero_alloc.rs` under the `dhat-heap` feature. Kept in
# dev-dependencies so it never appears in downstream crate graphs.
dhat = "0.3"
# Property-based invariant verification (`tests/proptest_invariants.rs`).
proptest = { version = "1", default-features = false, features = ["std"] }

# Model checker for the hazard-pointer handshake. Only resolved for
# `RUSTFLAGS="--cfg loom" cargo test --release --test loom_handshake`.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[[bench]]
name = "sync_notify"
harness = false
required-features = ["sync"]

[[bench]]
name = "register_unregister"
harness = false
required-features = ["sync"]

[[bench]]
name = "async_notify"
harness = false
required-features = ["async"]

[[bench]]
name = "contention"
harness = false
required-features = ["sync"]

[[example]]
name = "basic"
required-features = ["sync"]

[[example]]
name = "concurrent"
required-features = ["sync"]

[[example]]
name = "guards"
required-features = ["sync"]

[[example]]
name = "panic_isolation"
required-features = ["sync"]

[[example]]
name = "pattern_audit_fanout"
required-features = ["sync"]

[[example]]
name = "pattern_hot_reload"
required-features = ["sync"]

[[example]]
name = "pattern_metric_event"
required-features = ["sync"]

[[example]]
name = "pattern_transaction_hooks"
required-features = ["sync"]

[[example]]
name = "priority"
required-features = ["sync"]

[[example]]
name = "async_basic"
required-features = ["async"]

[[example]]
name = "async_concurrent_vs_sequential"
required-features = ["async"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
